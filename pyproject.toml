[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-character-studio"
version = "0.3.0"
description = "Local 3D character editing, versioned assets and multi-view reference export"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "Pillow>=10,<13", "numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
